name: Android build (AAR)

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: assemble + smoke (JNI + C layers)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with pinned vendor submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses + ensure NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" > /dev/null

      - name: Build release AAR
        run: ./gradlew --no-daemon :camerabridge:assembleRelease
        # AGP resolves both ABIs (arm64-v8a, armeabi-v7a) in one invocation.

      - name: Verify produced shared libraries
        run: |
          set -euo pipefail
          found="$(find camerabridge/build/intermediates -name 'libcamera_bridge.so' | sort | head -n 1 || true)"
          if [ -z "${found:-}" ]; then
            echo "libcamera_bridge.so missing — ABI(s) did not build"
            find camerabridge/build -name "*.so" | head -50
            exit 1
          fi
          dir="$(dirname "$found")"
          echo "built: $dir"
          ls -lh "$dir"
          for lib in libgphoto2.so libgphoto2_port.so libptp2.so libusb1.so; do
            test -f "$dir/$lib" || { echo "missing $lib"; exit 1; }
          done
          # confirm second ABI too (arm64-v8a + armeabi-v7a required)
          if ! find camerabridge/build/intermediates -name 'libcamera_bridge.so' | grep -q armeabi-v7a; then
            echo "armeabi-v7a build missing"
            exit 1
          fi
          echo "all native libraries built (both ABIs)"

      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: camerabridge-release
          path: camerabridge/build/outputs/aar/*.aar
